<!DOCTYPE html>

<html>
<head>
    <title>Event Handlers Example</title>

```
<script>
    function Handler() {
        window.location.href = "https://www.tutorialspoint.com/";
    }
</script>
```

</head>

<body>

```
<img src="https://www.tutorialspoint.com/images/logo.png"
     width="300"
     onclick="Handler();"
     style="cursor:pointer">
```

</body>
</html>
