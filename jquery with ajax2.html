<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jQuery AJAX Sample</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>

    <h2>jQuery AJAX Example</h2>

    <!-- GET Data Button -->
    <button id="getDataBtn">Get Post Data</button>

    <h3>Send Data (POST)</h3>
    <!-- POST Data Form -->
    <form id="postDataForm">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required>
        <br><br>
        <button type="submit">Send Data</button>
    </form>

    <h3>Response</h3>
    <div id="responseContainer"></div>

    <script>
        $(document).ready(function() {
            
            // Handle GET Request when "Get Post Data" button is clicked
            $("#getDataBtn").click(function() {
                $.ajax({
                    url: "https://jsonplaceholder.typicode.com/posts/1",  // Example API endpoint
                    type: "GET",  // Request type: GET
                    dataType: "json",  // Expected response type
                    success: function(response) {
                        // Display the title and body of the post in the response container
                        $("#responseContainer").html(
                            "<h4>" + response.title + "</h4><p>" + response.body + "</p>"
                        );
                    },
                    error: function(xhr, status, error) {
                        // If there's an error, display it
                        $("#responseContainer").html("<p>Error: " + error + "</p>");
                    }
                });
            });
